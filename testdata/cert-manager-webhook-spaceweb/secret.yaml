# Credential Secret for the gated conformance suite (TestRunsSuite).
# The suite kubectl-applies every file in this directory except config.json into
# the test namespace. Replace the placeholder values with real SpaceWeb
# control-panel credentials before running the suite manually — do NOT commit
# real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: spaceweb-credentials
type: Opaque
stringData:
  login: "REPLACE_WITH_SPACEWEB_LOGIN"
  password: "REPLACE_WITH_SPACEWEB_PASSWORD"

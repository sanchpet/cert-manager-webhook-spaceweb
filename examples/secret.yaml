# SpaceWeb control-panel credentials for the DNS-01 webhook solver.
#
# WARNING: these are your full SpaceWeb account login + password (there is no
# scoped API token). Treat this as a high-value secret: do NOT commit real
# values, prefer a Secret manager (e.g. External Secrets Operator), and enable
# encryption at rest for Secrets. The values below are SYNTHETIC placeholders.
#
# The Secret must live in the challenge's resource namespace:
#   - ClusterIssuer -> cert-manager's namespace (default: cert-manager)
#   - Issuer        -> the Issuer's own namespace
apiVersion: v1
kind: Secret
metadata:
  name: sweb-credentials
  namespace: cert-manager
type: Opaque
stringData:
  login: REPLACE_WITH_SWEB_LOGIN
  password: REPLACE_WITH_SWEB_PASSWORD

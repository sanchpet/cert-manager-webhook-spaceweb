name: release-please

# release-please maintains version + CHANGELOG.md from Conventional Commits. On
# push to main it opens/updates a "release PR"; merging it tags the release, and
# the gated job then builds and publishes the binaries, the multi-arch container
# image, and the Helm chart. No manual tags.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode: reads release-please-config.json + .release-please-manifest.json.
      # PAT (not GITHUB_TOKEN) so the release PR it opens triggers CI / pr-title checks.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # Multi-arch image builds need QEMU + buildx; login lets GoReleaser push to GHCR.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Binaries, checksums, and the multi-arch image + manifest → GHCR.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser cannot push Helm charts, so package + push the chart as an OCI
      # artifact here. The chart/app versions are the release tag without its "v".
      - name: Publish Helm chart (OCI)
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          CHART_VERSION="${TAG_NAME#v}"
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          helm package deploy/cert-manager-webhook-spaceweb \
            --version "${CHART_VERSION}" --app-version "${CHART_VERSION}"
          helm push "cert-manager-webhook-spaceweb-${CHART_VERSION}.tgz" oci://ghcr.io/sanchpet/charts

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-manager-webhook-spaceweb.labels" . | nindent 4 }}
---
# Grant cert-manager the ability to invoke the webhook's extension API, so it
# can call Present/CleanUp on this solver.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}:domain-solver
  labels:
    {{- include "cert-manager-webhook-spaceweb.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - 'create'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}:domain-solver
  labels:
    {{- include "cert-manager-webhook-spaceweb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
---
# Let the webhook apiserver delegate authn/authz to the kube-apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}:auth-delegator
  labels:
    {{- include "cert-manager-webhook-spaceweb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Read the extension-apiserver-authentication ConfigMap for delegated authn.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    {{- include "cert-manager-webhook-spaceweb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Allow the solver to read the SpaceWeb credentials Secret referenced by the
# Issuer (in the challenge's ResourceNamespace). Bound to the WEBHOOK's SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}:secret-reader
  labels:
    {{- include "cert-manager-webhook-spaceweb.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}:secret-reader
  labels:
    {{- include "cert-manager-webhook-spaceweb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-spaceweb.fullname" . }}
    namespace: {{ .Release.Namespace }}

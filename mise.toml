[tools]
go = "1.26"
golangci-lint = "2"
goreleaser = "2"
pre-commit = "latest"
helm = "latest"

[tasks.build]
description = "Compile every package (layout-agnostic sanity build)"
run = "go build ./..."

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ."

[tasks.chart-lint]
description = "Lint the Helm chart"
run = "helm lint deploy/cert-manager-webhook-spaceweb"

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "test", "build"]

[tasks.release-snapshot]
description = "Build a local release snapshot (no publish)"
run = "goreleaser release --snapshot --clean"
